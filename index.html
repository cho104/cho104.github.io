<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="Portfolio: works, about, coursework, resume and contact." />
    <script>
      // Apply the saved theme before first paint.
      try {
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <header class="nav" aria-label="Site">
      <a class="nav-home" href="/" data-link data-hover="home"></a>
      <nav class="nav-links">
        <a href="/coursework" data-link data-route="coursework">Coursework,</a>
        <a href="/resume" data-link data-route="resume">Resume,</a>
        <a href="/works" data-link data-route="works">Works,</a>
        <a href="/contact" data-link data-route="contact">Contact,</a>
        <a href="/about" data-link data-route="about">About</a>
      </nav>
      <button class="nav-theme" type="button" data-route="lamp" aria-label="Switch light or dark mode">
        <span class="t-light">Light</span><span class="t-sep">/</span><span class="t-dark">Dark</span>
      </button>
    </header>

    <h1 class="page-title" aria-live="polite"></h1>

    <main id="view"></main>

    <div id="labels" aria-hidden="true"></div>
    <p class="hint" aria-hidden="true"></p>

    <div id="intro" aria-hidden="true">
      <p class="intro-name"><span></span><i class="intro-wipe"></i></p>
    </div>

    <noscript>
      <p style="padding: 2rem">This site needs JavaScript. The same content is on <a href="https://github.com/cho104">GitHub</a>.</p>
    </noscript>
  </body>
</html>
